<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Berenice 🌼</title>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: #fff09b;
}


/* =========================
   ESCENA
========================= */

.scene {

    width: 100vw;
    height: 100vh;

    position: relative;

    overflow: hidden;

    touch-action: manipulation;

    background:
        radial-gradient(
            circle at center,
            #fffbd2 0%,
            #fff09b 45%,
            #ffd45c 100%
        );

    transition:
        background 1.2s ease;
}


/* =========================
   MODO NOCHE
========================= */

.scene.night {

    background:
        radial-gradient(
            circle at 50% 35%,
            #27345f 0%,
            #111a3d 50%,
            #070b20 100%
        );
}


/* =========================
   NOMBRE
========================= */

h1 {

    position: absolute;

    z-index: 30;

    top: 8%;

    width: 100%;

    margin: 0;

    text-align: center;

    color: #6b4b00;

    font-size:
        clamp(
            42px,
            12vw,
            82px
        );

    text-shadow:
        0 3px 8px
        rgba(255,255,255,.8);

    pointer-events: none;

    transition:
        color 1s ease,
        text-shadow 1s ease;
}


.scene.night h1 {

    color: #fff4a8;

    text-shadow:
        0 0 12px #fff2a6,
        0 0 25px #ffd83d;
}


/* =========================
   BOTÓN DÍA / NOCHE
========================= */

.modeButton {

    position: absolute;

    top: 18px;
    right: 18px;

    z-index: 100;

    width: 52px;
    height: 52px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,.75);

    backdrop-filter:
        blur(5px);

    font-size: 25px;

    cursor: pointer;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.2);

    transition:
        transform .2s ease,
        background .5s ease;
}


.modeButton:active {

    transform:
        scale(.85)
        rotate(15deg);
}


.scene.night .modeButton {

    background:
        rgba(20,25,60,.8);

}


/* =========================
   FLORES
========================= */

.flower {

    position: absolute;

    width: 52px;
    height: 52px;

    padding: 0;

    border: none;

    background: transparent;

    font-size: 42px;

    line-height: 1;

    cursor: pointer;

    user-select: none;

    -webkit-tap-highlight-color:
        transparent;

    z-index: 10;

    animation:
        flowerFloat
        3s
        ease-in-out
        infinite;

    transition:
        transform .18s ease;
}


.flower:active {

    transform:
        scale(1.5)
        rotate(12deg);
}


.flower.new {

    animation:
        flowerAppear
        .5s
        ease-out,

        flowerFloat
        3s
        .5s
        ease-in-out
        infinite;
}


/* =========================
   FLOR ESPECIAL
========================= */

.specialFlower {

    position: absolute;

    z-index: 25;

    left: 50%;

    top: 52%;

    transform:
        translate(-50%, -50%);

    width: 85px;
    height: 85px;

    border: none;

    background: transparent;

    font-size: 68px;

    cursor: pointer;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,210,40,.8)
        );

    animation:
        specialFlowerFloat
        3s
        ease-in-out
        infinite;

    transition:
        transform .3s ease,
        filter .5s ease;
}


.specialFlower:active {

    transform:
        translate(-50%, -50%)
        scale(1.4)
        rotate(15deg);
}


.scene.night .specialFlower {

    filter:
        drop-shadow(
            0 0 15px
            #ffe66d
        )
        drop-shadow(
            0 0 30px
            #ffd21f
        );
}


/* =========================
   MARIPOSAS
========================= */

.butterfly {

    position: absolute;

    z-index: 20;

    font-size: 32px;

    pointer-events: none;

    user-select: none;

    filter:
        drop-shadow(
            0 2px 3px
            rgba(0,0,0,.15)
        );

    animation:
        butterflyFloat
        6s
        ease-in-out
        infinite;

    transition:
        opacity .5s ease;
}


/* =========================
   ESTRELLAS
========================= */

.star {

    position: absolute;

    z-index: 5;

    color: white;

    font-size: 10px;

    opacity: 0;

    pointer-events: none;

    animation:
        starTwinkle
        2s
        ease-in-out
        infinite;
}


.scene.night .star {

    opacity: 1;
}


/* =========================
   LUNA
========================= */

.moon {

    position: absolute;

    z-index: 4;

    top: 12%;

    left: 12%;

    font-size: 65px;

    opacity: 0;

    transform:
        scale(.5);

    transition:
        opacity 1s ease,
        transform 1s ease;
}


.scene.night .moon {

    opacity: 1;

    transform:
        scale(1);
}


/* =========================
   MENSAJE
========================= */

.messageBox {

    position: absolute;

    z-index: 200;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.7);

    width: 85%;

    max-width: 420px;

    padding: 30px 24px;

    border-radius: 25px;

    background:
        rgba(255,255,255,.94);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.3);

    text-align: center;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .4s ease,
        transform .4s ease;
}


.messageBox.show {

    opacity: 1;

    pointer-events: auto;

    transform:
        translate(-50%, -50%)
        scale(1);
}


.messageBox h2 {

    margin-top: 0;

    color: #d69c00;

    font-size: 28px;
}


.messageBox p {

    color: #555;

    font-size: 17px;

    line-height: 1.5;
}


.closeMessage {

    margin-top: 10px;

    padding: 10px 22px;

    border: none;

    border-radius: 20px;

    background: #ffd43b;

    color: #604500;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   TEXTO INFERIOR
========================= */

.hint {

    position: absolute;

    z-index: 30;

    bottom: 5%;

    width: 100%;

    text-align: center;

    color: #6b4b00;

    font-size: 16px;

    font-weight: 600;

    pointer-events: none;

    transition:
        color 1s ease;
}


.scene.night .hint {

    color: #fff3a1;
}


/* =========================
   DESTELLOS
========================= */

.spark {

    position: absolute;

    z-index: 50;

    pointer-events: none;

    font-size: 22px;

    animation:
        sparkAnimation
        .7s
        ease-out
        forwards;
}


/* =========================
   EFECTO DE TOQUE
========================= */

.touchEffect {

    position: absolute;

    z-index: 40;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    pointer-events: none;

    background:
        rgba(
            255,
            255,
            255,
            .8
        );

    box-shadow:
        0 0 18px
        rgba(255,255,255,.9);

    animation:
        touchAnimation
        .6s
        ease-out
        forwards;
}


/* =========================
   ANIMACIONES
========================= */

@keyframes flowerFloat {

    0%,
    100% {

        margin-top: 0;

        transform:
            rotate(-2deg);
    }

    50% {

        margin-top: -9px;

        transform:
            rotate(2deg);
    }
}


@keyframes flowerAppear {

    0% {

        transform:
            scale(0);

        opacity: 0;
    }

    70% {

        transform:
            scale(1.35);

        opacity: 1;
    }

    100% {

        transform:
            scale(1);

        opacity: 1;
    }
}


@keyframes specialFlowerFloat {

    0%,
    100% {

        margin-top: 0;

        transform:
            translate(-50%, -50%)
            rotate(-3deg)
            scale(1);
    }

    50% {

        margin-top: -12px;

        transform:
            translate(-50%, -50%)
            rotate(3deg)
            scale(1.08);
    }
}


@keyframes butterflyFloat {

    0% {

        transform:
            translate(0,0)
            rotate(-8deg);
    }

    20% {

        transform:
            translate(25px,-35px)
            rotate(8deg);
    }

    40% {

        transform:
            translate(-20px,-65px)
            rotate(-5deg);
    }

    60% {

        transform:
            translate(35px,-30px)
            rotate(7deg);
    }

    80% {

        transform:
            translate(-15px,15px)
            rotate(-7deg);
    }

    100% {

        transform:
            translate(0,0)
            rotate(-8deg);
    }
}


@keyframes starTwinkle {

    0%,
    100% {

        transform:
            scale(.6);

        opacity: .3;
    }

    50% {

        transform:
            scale(1.5);

        opacity: 1;
    }
}


@keyframes sparkAnimation {

    0% {

        transform:
            translate(0,0)
            scale(.4);

        opacity: 1;
    }

    100% {

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(1.2);

        opacity: 0;
    }
}


@keyframes touchAnimation {

    0% {

        transform:
            scale(.5);

        opacity: .9;
    }

    100% {

        transform:
            scale(5);

        opacity: 0;
    }
}

</style>

</head>


<body>


<div
    class="scene"
    id="scene"
>


    <!-- =====================
         NOMBRE
    ====================== -->

    <h1>
        Berenice
    </h1>



    <!-- =====================
         BOTÓN DÍA / NOCHE
    ====================== -->

    <button
        class="modeButton"
        id="modeButton"
        aria-label="Cambiar entre día y noche"
    >
        🌙
    </button>



    <!-- =====================
         LUNA
    ====================== -->

    <div class="moon">
        🌙
    </div>



    <!-- =====================
         ESTRELLAS
    ====================== -->

    <div class="star" style="left:8%;top:15%;animation-delay:.2s;">✦</div>

    <div class="star" style="left:22%;top:10%;animation-delay:.8s;">✦</div>

    <div class="star" style="left:35%;top:20%;animation-delay:1.2s;">✦</div>

    <div class="star" style="left:52%;top:12%;animation-delay:.4s;">✦</div>

    <div class="star" style="left:68%;top:18%;animation-delay:1.5s;">✦</div>

    <div class="star" style="left:82%;top:11%;animation-delay:.9s;">✦</div>

    <div class="star" style="left:92%;top:25%;animation-delay:1.8s;">✦</div>

    <div class="star" style="left:15%;top:42%;animation-delay:1s;">✦</div>

    <div class="star" style="left:88%;top:48%;animation-delay:.6s;">✦</div>

    <div class="star" style="left:5%;top:70%;animation-delay:1.7s;">✦</div>

    <div class="star" style="left:30%;top:78%;animation-delay:.3s;">✦</div>

    <div class="star" style="left:72%;top:82%;animation-delay:1.3s;">✦</div>



    <!-- =====================
         MARIPOSAS
    ====================== -->

    <div
        class="butterfly"
        style="
            left:12%;
            top:28%;
            animation-duration:6s;
        "
    >
        🦋
    </div>


    <div
        class="butterfly"
        style="
            left:72%;
            top:35%;
            animation-duration:7s;
            animation-delay:1s;
        "
    >
        🦋
    </div>


    <div
        class="butterfly"
        style="
            left:40%;
            top:65%;
            animation-duration:8s;
            animation-delay:2s;
        "
    >
        🦋
    </div>


    <div
        class="butterfly"
        style="
            left:82%;
            top:70%;
            animation-duration:6.5s;
            animation-delay:3s;
        "
    >
        🦋
    </div>



    <!-- =====================
         FLOR ESPECIAL
    ====================== -->

    <button
        class="specialFlower"
        id="specialFlower"
        aria-label="Abrir mensaje especial"
    >
        🌻
    </button>



    <!-- =====================
         TEXTO
    ====================== -->

    <div class="hint">
        Toca las flores 🌼
    </div>



    <!-- =====================
         MENSAJE ESPECIAL
    ====================== -->

    <div
        class="messageBox"
        id="messageBox"
    >

        <h2>
            Para ti 💛
        </h2>

        <p>
            Solo quería recordarte que eres
            importante para mí.
        </p>

        <button
            class="closeMessage"
            id="closeMessage"
        >
            Cerrar
        </button>

    </div>


</div>



<script>

(() => {


    /* =========================
       ELEMENTOS
    ========================= */

    const scene =
        document.getElementById(
            "scene"
        );


    const modeButton =
        document.getElementById(
            "modeButton"
        );


    const specialFlower =
        document.getElementById(
            "specialFlower"
        );


    const messageBox =
        document.getElementById(
            "messageBox"
        );


    const closeMessage =
        document.getElementById(
            "closeMessage"
        );



    /* =========================
       FLORES INICIALES
    ========================= */

    const initialFlowers = [

        [8,18],
        [22,30],
        [78,22],
        [90,39],
        [12,55],
        [31,68],
        [67,58],
        [84,72],
        [48,84],
        [4,82],
        [58,34],
        [38,18]

    ];


    let flowerCount = 0;

    const MAX_FLOWERS = 90;



    /* =========================
       CREAR FLOR
    ========================= */

    function createFlower(
        x,
        y,
        isNew = false
    ) {


        if (
            flowerCount >=
            MAX_FLOWERS
        ) {
            return;
        }


        const flower =
            document.createElement(
                "button"
            );


        flower.type =
            "button";


        flower.className =
            "flower" +
            (
                isNew
                ? " new"
                : ""
            );


        flower.textContent =
            "🌼";


        flower.setAttribute(
            "aria-label",
            "Flor amarilla"
        );


        flower.style.left =
            `calc(${x}% - 26px)`;


        flower.style.top =
            `calc(${y}% - 26px)`;


        flower.style.animationDelay =
            `${Math.random() * 1.5}s`;



        flower.addEventListener(
            "click",
            function(event) {


                event.stopPropagation();


                const rect =
                    scene.getBoundingClientRect();


                const centerX =
                    event.clientX -
                    rect.left;


                const centerY =
                    event.clientY -
                    rect.top;


                createTouchEffect(
                    centerX,
                    centerY
                );


                createParticles(
                    centerX,
                    centerY
                );



                /* Crear 4 flores nuevas */

                for (
                    let i = 0;
                    i < 4;
                    i++
                ) {


                    const angle =
                        Math.random() *
                        Math.PI *
                        2;


                    const distance =
                        7 +
                        Math.random() * 9;


                    let newX =
                        x +
                        Math.cos(angle) *
                        distance;


                    let newY =
                        y +
                        Math.sin(angle) *
                        distance;


                    newX =
                        Math.max(
                            4,
                            Math.min(
                                96,
                                newX
                            )
                        );


                    newY =
                        Math.max(
                            15,
                            Math.min(
                                94,
                                newY
                            )
                        );


                    createFlower(
                        newX,
                        newY,
                        true
                    );

                }

            }
        );


        scene.appendChild(
            flower
        );


        flowerCount++;

    }



    /* =========================
       DESTELLOS
    ========================= */

    function createParticles(
        x,
        y
    ) {


        for (
            let i = 0;
            i < 7;
            i++
        ) {


            const spark =
                document.createElement(
                    "span"
                );


            spark.className =
                "spark";


            spark.textContent =
                i % 2
                ? "✨"
                : "🌼";


            spark.style.left =
                `${x - 11}px`;


            spark.style.top =
                `${y - 11}px`;


            spark.style.setProperty(
                "--x",
                `${
                    Math.cos(
                        i * .897
                    ) * 65
                }px`
            );


            spark.style.setProperty(
                "--y",
                `${
                    Math.sin(
                        i * .897
                    ) * 65
                }px`
            );


            scene.appendChild(
                spark
            );


            setTimeout(
                () => {
                    spark.remove();
                },
                700
            );

        }

    }



    /* =========================
       EFECTO TÁCTIL
    ========================= */

    function createTouchEffect(
        x,
        y
    ) {


        const effect =
            document.createElement(
                "div"
            );


        effect.className =
            "touchEffect";


        effect.style.left =
            `${x - 9}px`;


        effect.style.top =
            `${y - 9}px`;


        scene.appendChild(
            effect
        );


        setTimeout(
            () => {
                effect.remove();
            },
            650
        );

    }



    /* =========================
       FLORES INICIALES
    ========================= */

    initialFlowers.forEach(
        ([x,y]) => {

            createFlower(
                x,
                y
            );

        }
    );



    /* =========================
       TOCAR FONDO
    ========================= */

    scene.addEventListener(
        "click",
        function(event) {


            if (
                event.target !== scene
            ) {
                return;
            }


            if (
                flowerCount >=
                MAX_FLOWERS
            ) {
                return;
            }


            const rect =
                scene.getBoundingClientRect();


            const x =
                (
                    (
                        event.clientX -
                        rect.left
                    ) /
                    rect.width
                ) * 100;


            const y =
                (
                    (
                        event.clientY -
                        rect.top
                    ) /
                    rect.height
                ) * 100;


            createFlower(
                x,
                y,
                true
            );


            createTouchEffect(

                event.clientX -
                rect.left,

                event.clientY -
                rect.top

            );

        }
    );



    /* =========================
       CAMBIAR DÍA / NOCHE
    ========================= */

    modeButton.addEventListener(
        "click",
        function(event) {


            event.stopPropagation();


            scene.classList.toggle(
                "night"
            );


            if (
                scene.classList.contains(
                    "night"
                )
            ) {

                modeButton.textContent =
                    "☀️";

            } else {

                modeButton.textContent =
                    "🌙";

            }

        }
    );



    /* =========================
       FLOR ESPECIAL
    ========================= */

    specialFlower.addEventListener(
        "click",
        function(event) {


            event.stopPropagation();


            messageBox.classList.add(
                "show"
            );


            const rect =
                scene.getBoundingClientRect();


            createParticles(

                rect.width / 2,

                rect.height / 2

            );

        }
    );



    /* =========================
       CERRAR MENSAJE
    ========================= */

    closeMessage.addEventListener(
        "click",
        function(event) {


            event.stopPropagation();


            messageBox.classList.remove(
                "show"
            );

        }
    );


})();

</script>


</body>
</html>
