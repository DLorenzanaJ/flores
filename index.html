
<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Berenice 🌼</title>


<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        sans-serif;
}


body {

    background:

        radial-gradient(
            circle at center,
            #fffbd2 0%,
            #fff09b 42%,
            #ffd45c 100%
        );

    display: flex;

    justify-content: center;

    align-items: center;

}


/* =========================
   ESCENA
========================= */

.scene {

    width: 100vw;

    height: 100vh;

    position: relative;

    overflow: hidden;

    touch-action: manipulation;

}


/* =========================
   NOMBRE
========================= */

h1 {

    position: absolute;

    z-index: 20;

    top: 8%;

    width: 100%;

    margin: 0;

    text-align: center;

    color: #6b4b00;

    font-size:
        clamp(
            42px,
            12vw,
            82px
        );

    text-shadow:

        0 3px 8px
        rgba(255,255,255,.8);

    pointer-events: none;

}


/* =========================
   FLORES
========================= */

.flower {

    position: absolute;

    width: 52px;

    height: 52px;

    padding: 0;

    border: none;

    background: transparent;

    font-size: 42px;

    line-height: 1;

    cursor: pointer;

    user-select: none;

    -webkit-tap-highlight-color:
        transparent;

    animation:

        floatingFlower
        3s
        ease-in-out
        infinite;

    transition:

        transform .18s ease;

}


.flower:active {

    transform:

        scale(1.5)
        rotate(12deg);

}


.flower.new {

    animation:

        flowerAppear
        .5s
        ease-out,

        floatingFlower
        3s
        .5s
        ease-in-out
        infinite;

}


/* =========================
   TEXTO INFERIOR
========================= */

.hint {

    position: absolute;

    z-index: 20;

    bottom: 5%;

    width: 100%;

    text-align: center;

    color: #6b4b00;

    font-size: 16px;

    font-weight: 600;

    pointer-events: none;

}


/* =========================
   MARIPOSAS
========================= */

.butterfly {

    position: absolute;

    z-index: 8;

    font-size: 32px;

    pointer-events: none;

    animation:

        butterflyMove
        linear
        infinite;

    filter:

        drop-shadow(
            0 2px 3px
            rgba(0,0,0,.15)
        );

}


/* =========================
   PARTÍCULAS
========================= */

.spark {

    position: absolute;

    z-index: 30;

    pointer-events: none;

    font-size: 22px;

    animation:

        burst
        .7s
        ease-out
        forwards;

}


/* =========================
   EFECTO TÁCTIL
========================= */

.touchEffect {

    position: absolute;

    z-index: 25;

    width: 18px;

    height: 18px;

    border-radius: 50%;

    pointer-events: none;

    background:

        rgba(
            255,
            255,
            255,
            .75
        );

    box-shadow:

        0 0 15px
        rgba(255,255,255,.9);

    animation:

        touchAnimation
        .6s
        ease-out
        forwards;

}


/* =========================
   ANIMACIONES
========================= */

@keyframes floatingFlower {

    0%,
    100% {

        margin-top: 0;

        transform:
            rotate(-2deg);

    }

    50% {

        margin-top: -9px;

        transform:
            rotate(2deg);

    }

}


@keyframes flowerAppear {

    0% {

        transform:
            scale(0);

        opacity: 0;

    }

    70% {

        transform:
            scale(1.35);

        opacity: 1;

    }

    100% {

        transform:
            scale(1);

        opacity: 1;

    }

}


@keyframes burst {

    from {

        transform:

            translate(0,0)
            scale(.4);

        opacity: 1;

    }

    to {

        transform:

            translate(
                var(--x),
                var(--y)
            )

            scale(1.2);

        opacity: 0;

    }

}


@keyframes touchAnimation {

    0% {

        transform:
            scale(.5);

        opacity: .9;

    }

    100% {

        transform:
            scale(5);

        opacity: 0;

    }

}


@keyframes butterflyMove {

    0% {

        transform:

            translate(
                -80px,
                0
            )

            rotate(
                -8deg
            );

    }

    25% {

        transform:

            translate(
                25vw,
                -30px
            )

            rotate(
                8deg
            );

    }

    50% {

        transform:

            translate(
                50vw,
                20px
            )

            rotate(
                -5deg
            );

    }

    75% {

        transform:

            translate(
                75vw,
                -20px
            )

            rotate(
                8deg
            );

    }

    100% {

        transform:

            translate(
                110vw,
                10px
            )

            rotate(
                -8deg
            );

    }

}


/* =========================
   ACCESIBILIDAD
========================= */

@media (
    prefers-reduced-motion: reduce
) {

    .flower {

        animation: none;

    }

    .flower.new {

        animation:
            flowerAppear
            .3s
            ease-out;

    }

    .butterfly {

        animation: none;

    }

}

</style>

</head>


<body>


<div
    class="scene"
    id="scene"
>


    <!-- NOMBRE -->

    <h1>
        Berenice
    </h1>


    <!-- TEXTO -->

    <div class="hint">

        Toca las flores 🌼

    </div>


    <!-- MARIPOSAS -->

    <div
        class="butterfly"
        style="
            top: 25%;
            left: -50px;
            animation-duration: 14s;
        "
    >
        🦋
    </div>


    <div
        class="butterfly"
        style="
            top: 55%;
            left: -80px;
            animation-duration: 18s;
            animation-delay: 4s;
        "
    >
        🦋
    </div>


    <div
        class="butterfly"
        style="
            top: 72%;
            left: -100px;
            animation-duration: 21s;
            animation-delay: 8s;
        "
    >
        🦋
    </div>


</div>



<script>


/* =========================
   INICIO
========================= */

(() => {


    const scene =
        document.getElementById(
            "scene"
        );


    /*
       Posiciones iniciales
    */

    const initialFlowers = [

        [8,18],

        [22,30],

        [78,22],

        [90,39],

        [12,55],

        [31,68],

        [67,58],

        [84,72],

        [48,84],

        [4,82],

        [58,34],

        [38,18]

    ];


    /*
       Contador
    */

    let flowerCount = 0;


    /*
       Máximo de flores
    */

    const MAX_FLOWERS = 90;



    /* =========================
       CREAR FLOR
    ========================= */

    function createFlower(
        x,
        y,
        isNew = false
    ) {


        if (
            flowerCount >=
            MAX_FLOWERS
        ) {

            return;

        }


        const flower =
            document.createElement(
                "button"
            );


        flower.type =
            "button";


        flower.className =

            "flower" +

            (
                isNew
                ? " new"
                : ""
            );


        flower.textContent =
            "🌼";


        flower.setAttribute(

            "aria-label",

            "Flor amarilla. " +
            "Tócala para que " +
            "aparezcan más."

        );


        flower.style.left =

            `calc(
                ${x}%
                - 26px
            )`;


        flower.style.top =

            `calc(
                ${y}%
                - 26px
            )`;


        flower.style.animationDelay =

            `${Math.random() * 1.5}s`;



        /* =====================
           TOCAR FLOR
        ===================== */

        flower.addEventListener(
            "click",
            function(event) {


                event.stopPropagation();



                /*
                   Posición del toque
                */

                const rect =
                    scene.getBoundingClientRect();


                const centerX =

                    event.clientX
                    -
                    rect.left;


                const centerY =

                    event.clientY
                    -
                    rect.top;



                /*
                   Efecto táctil
                */

                createTouchEffect(
                    centerX,
                    centerY
                );



                /*
                   Destellos
                */

                createParticles(
                    centerX,
                    centerY
                );



                /*
                   Crear flores nuevas
                */

                for (
                    let i = 0;
                    i < 4;
                    i++
                ) {


                    const angle =

                        Math.random()
                        *
                        Math.PI
                        *
                        2;


                    const distance =

                        7
                        +
                        Math.random()
                        *
                        9;


                    let newX =

                        x
                        +
                        Math.cos(
                            angle
                        )
                        *
                        distance;


                    let newY =

                        y
                        +
                        Math.sin(
                            angle
                        )
                        *
                        distance;



                    /*
                       No salir
                       de la pantalla
                    */

                    newX =

                        Math.max(
                            4,
                            Math.min(
                                96,
                                newX
                            )
                        );


                    newY =

                        Math.max(
                            15,
                            Math.min(
                                94,
                                newY
                            )
                        );



                    createFlower(
                        newX,
                        newY,
                        true
                    );

                }

            }
        );



        scene.appendChild(
            flower
        );


        flowerCount++;


    }



    /* =========================
       PARTÍCULAS
    ========================= */

    function createParticles(
        x,
        y
    ) {


        for (
            let i = 0;
            i < 7;
            i++
        ) {


            const spark =
                document.createElement(
                    "span"
                );


            spark.className =
                "spark";


            spark.textContent =

                i % 2
                ? "✨"
                : "🌼";


            spark.style.left =

                `${x - 11}px`;


            spark.style.top =

                `${y - 11}px`;


            spark.style.setProperty(

                "--x",

                `${
                    Math.cos(
                        i * 0.897
                    ) * 65
                }px`

            );


            spark.style.setProperty(

                "--y",

                `${
                    Math.sin(
                        i * 0.897
                    ) * 65
                }px`

            );


            scene.appendChild(
                spark
            );


            setTimeout(
                () => {

                    spark.remove();

                },
                700
            );

        }

    }



    /* =========================
       EFECTO TÁCTIL
    ========================= */

    function createTouchEffect(
        x,
        y
    ) {


        const effect =
            document.createElement(
                "div"
            );


        effect.className =
            "touchEffect";


        effect.style.left =
            `${x - 9}px`;


        effect.style.top =
            `${y - 9}px`;


        scene.appendChild(
            effect
        );


        setTimeout(
            () => {

                effect.remove();

            },
            650
        );

    }



    /* =========================
       FLORES INICIALES
    ========================= */

    initialFlowers.forEach(

        ([x, y]) => {

            createFlower(
                x,
                y
            );

        }

    );



    /* =========================
       TOCAR ESPACIO VACÍO
    ========================= */

    scene.addEventListener(
        "click",
        function(event) {


            if (
                event.target !== scene
            ) {

                return;

            }


            if (
                flowerCount >=
                MAX_FLOWERS
            ) {

                return;

            }


            const rect =
                scene.getBoundingClientRect();


            const x =

                (
                    (
                        event.clientX
                        -
                        rect.left
                    )
                    /
                    rect.width
                )
                *
                100;


            const y =

                (
                    (
                        event.clientY
                        -
                        rect.top
                    )
                    /
                    rect.height
                )
                *
                100;



            /*
               Flor nueva
            */

            createFlower(
                x,
                y,
                true
            );



            /*
               Efecto táctil
            */

            createTouchEffect(

                event.clientX
                -
                rect.left,

                event.clientY
                -
                rect.top

            );


        }
    );


})();

</script>


</body>
</html>
