<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berenice 🌼</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;background:linear-gradient(#fffbe8,#ffe58a);display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
h1{position:relative;z-index:3;color:#6b4d00;font-size:48px;text-shadow:0 2px 8px #fff;margin:0 0 30px}
.garden{position:fixed;inset:0}
.flower{position:absolute;font-size:58px;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.f1{left:8%;top:12%;animation-delay:.2s}.f2{left:24%;top:28%;font-size:48px;animation-delay:1s}
.f3{left:42%;top:9%;font-size:62px;animation-delay:.5s}.f4{right:24%;top:24%;font-size:50px;animation-delay:1.4s}
.f5{right:7%;top:12%;animation-delay:.8s}.f6{left:12%;bottom:18%;font-size:50px;animation-delay:1.7s}
.f7{left:34%;bottom:8%;font-size:62px;animation-delay:.4s}.f8{right:35%;bottom:14%;font-size:48px;animation-delay:1.1s}
.f9{right:10%;bottom:20%;font-size:58px;animation-delay:1.8s}.f10{left:48%;bottom:28%;font-size:45px;animation-delay:1.3s}
@media(max-width:500px){h1{font-size:42px}.flower{font-size:48px}}
</style>
</head>
<body>
<div class="garden">
  <div class="flower f1">🌼</div><div class="flower f2">🌼</div>
  <div class="flower f3">🌼</div><div class="flower f4">🌼</div>
  <div class="flower f5">🌼</div><div class="flower f6">🌼</div>
  <div class="flower f7">🌼</div><div class="flower f8">🌼</div>
  <div class="flower f9">🌼</div><div class="flower f10">🌼</div>
</div>
<h1>Berenice</h1>
</body>
</html>
