<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Berenice 🌼</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(
        135deg,
        #fff176,
        #ffd54f,
        #ffca28
    );

    transition: background 1s ease;

    position: relative;

    color: #5d4037;
}

body.night {
    background: linear-gradient(
        135deg,
        #10152f,
        #1b2350,
        #273469
    );

    color: white;
}


/* =========================
   TÍTULO
========================= */

.title {

    position: fixed;

    top: 35px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    font-size:
        clamp(40px, 10vw, 80px);

    font-family:
        Georgia, serif;

    color: white;

    text-shadow:
        0 0 10px
        rgba(255,193,7,.9),

        0 0 25px
        rgba(255,152,0,.8),

        2px 3px 5px
        rgba(0,0,0,.3);

    pointer-events: none;
}


/* =========================
   BOTÓN DÍA / NOCHE
========================= */

#nightButton {

    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 200;

    width: 50px;
    height: 50px;

    border: none;

    border-radius: 50%;

    font-size: 24px;

    cursor: pointer;

    background:
        rgba(255,255,255,.8);

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.2);
}


/* =========================
   FLORES
========================= */

.flower {

    position: absolute;

    font-size: 35px;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

    animation:
        float 4s
        ease-in-out infinite;

    transition:
        transform .2s;

    z-index: 20;
}

.flower:hover {

    transform:
        scale(1.35);
}


@keyframes float {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(-5deg);
    }

    50% {

        transform:
            translateY(-15px)
            rotate(5deg);
    }
}


/* =========================
   FLOR ESPECIAL
========================= */

.special-flower {

    position: absolute;

    left: 50%;
    top: 55%;

    transform:
        translate(-50%, -50%);

    font-size: 90px;

    cursor: pointer;

    z-index: 50;

    animation:
        specialFloat
        3s
        ease-in-out
        infinite;

    filter:
        drop-shadow(
            0 0 15px
            rgba(255,193,7,.8)
        );
}


@keyframes specialFloat {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.12);
    }
}


/* =========================
   MARIPOSAS
========================= */

.butterfly {

    position: absolute;

    font-size: 30px;

    z-index: 15;

    animation:
        butterflyMove
        linear infinite;

    pointer-events: none;
}


.b1 {

    top: 20%;
    left: -50px;

    animation-duration: 16s;
}


.b2 {

    top: 40%;
    left: -50px;

    animation-duration: 20s;

    animation-delay: 4s;
}


.b3 {

    top: 70%;
    left: -50px;

    animation-duration: 18s;

    animation-delay: 7s;
}


.b4 {

    top: 30%;
    left: -50px;

    animation-duration: 23s;

    animation-delay: 10s;
}


@keyframes butterflyMove {

    0% {

        transform:
            translateX(-80px)
            translateY(0)
            rotate(0deg);
    }

    25% {

        transform:
            translateX(30vw)
            translateY(-50px)
            rotate(10deg);
    }

    50% {

        transform:
            translateX(60vw)
            translateY(50px)
            rotate(-10deg);
    }

    75% {

        transform:
            translateX(85vw)
            translateY(-30px)
            rotate(10deg);
    }

    100% {

        transform:
            translateX(110vw)
            translateY(20px)
            rotate(0deg);
    }
}


/* =========================
   ESTRELLAS
========================= */

.star {

    position: absolute;

    color: white;

    font-size: 12px;

    opacity: 0;

    z-index: 2;

    transition:
        opacity 1s;
}


body.night .star {

    opacity: 1;
}


/* =========================
   LUNA
========================= */

.moon {

    position: fixed;

    top: 80px;
    left: 40px;

    font-size: 60px;

    opacity: 0;

    transition:
        opacity 1s;

    z-index: 5;
}


body.night .moon {

    opacity: 1;
}


/* =========================
   PARTÍCULAS
========================= */

.particle {

    position: absolute;

    pointer-events: none;

    z-index: 100;

    font-size: 22px;

    animation:
        particleAnimation
        1s
        forwards;
}


@keyframes particleAnimation {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(.3);
    }
}


/* =========================
   RIPPLE
========================= */

.ripple {

    position: absolute;

    width: 20px;
    height: 20px;

    border:
        3px solid white;

    border-radius: 50%;

    pointer-events: none;

    z-index: 90;

    animation:
        rippleAnimation
        .7s
        forwards;
}


@keyframes rippleAnimation {

    from {

        opacity: .9;

        transform:
            scale(.2);
    }

    to {

        opacity: 0;

        transform:
            scale(8);
    }
}


/* =========================
   MODAL
========================= */

.modal {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.65);

    display: none;

    justify-content: center;

    align-items: center;

    z-index: 500;

    padding: 20px;
}


.modal.active {

    display: flex;
}


/* =========================
   CAJA DE MÚSICA
========================= */

.music-box {

    width:
        min(90%, 420px);

    background: white;

    color: #333;

    border-radius: 25px;

    padding:
        30px 25px;

    text-align: center;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.5);

    animation:
        modalIn .3s ease;
}


@keyframes modalIn {

    from {

        transform:
            scale(.7);

        opacity: 0;
    }

    to {

        transform:
            scale(1);

        opacity: 1;
    }
}


.music-box h2 {

    font-size: 25px;

    margin-bottom: 8px;
}


.music-icon {

    font-size: 55px;

    margin-bottom: 10px;
}


.music-box p {

    margin-bottom: 20px;

    color: #666;
}


/* =========================
   BOTÓN REPRODUCIR
========================= */

.play-button {

    border: none;

    background:
        #fbc02d;

    color:
        #5d4037;

    padding:
        15px 35px;

    border-radius: 30px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.2);

    transition:
        transform .15s,
        background .2s;
}


.play-button:hover {

    background:
        #f9a825;
}


.play-button:active {

    transform:
        scale(.95);
}


/* =========================
   BOTÓN CERRAR
========================= */

.close-button {

    margin-top: 20px;

    border: none;

    padding:
        12px 25px;

    border-radius: 20px;

    background:
        #eeeeee;

    color:
        #444;

    font-size: 16px;

    cursor: pointer;

    font-weight: bold;
}


.close-button:hover {

    background:
        #dddddd;
}


/* =========================
   TEXTO INFERIOR
========================= */

.hint {

    position: fixed;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 100;

    background:
        rgba(255,255,255,.75);

    padding:
        10px 18px;

    border-radius: 20px;

    font-size: 14px;

    color:
        #5d4037;

    text-align: center;
}


body.night .hint {

    background:
        rgba(0,0,0,.45);

    color: white;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .title {

        top: 45px;
    }

    .special-flower {

        font-size: 80px;
    }

    .flower {

        font-size: 30px;
    }

    .music-box {

        padding:
            25px 20px;
    }
}

</style>
</head>


<body>


<!-- =========================
     TÍTULO
========================= -->

<h1 class="title">
    Berenice
</h1>


<!-- =========================
     BOTÓN DÍA / NOCHE
========================= -->

<button id="nightButton">
    🌙
</button>


<!-- LUNA -->

<div class="moon">
    🌙
</div>


<!-- =========================
     MARIPOSAS
========================= -->

<div class="butterfly b1">
    🦋
</div>

<div class="butterfly b2">
    🦋
</div>

<div class="butterfly b3">
    🦋
</div>

<div class="butterfly b4">
    🦋
</div>


<!-- =========================
     ESTRELLAS
========================= -->

<div
    class="star"
    style="top:10%;left:20%;"
>
    ✦
</div>

<div
    class="star"
    style="top:18%;left:70%;"
>
    ✦
</div>

<div
    class="star"
    style="top:30%;left:40%;"
>
    ✧
</div>

<div
    class="star"
    style="top:45%;left:85%;"
>
    ✦
</div>

<div
    class="star"
    style="top:60%;left:15%;"
>
    ✧
</div>

<div
    class="star"
    style="top:75%;left:65%;"
>
    ✦
</div>

<div
    class="star"
    style="top:85%;left:35%;"
>
    ✧
</div>

<div
    class="star"
    style="top:25%;left:90%;"
>
    ✦
</div>


<!-- =========================
     FLOR ESPECIAL
========================= -->

<div
    class="special-flower"
    id="specialFlower"
>
    🌻
</div>


<!-- =========================
     TEXTO INFERIOR
========================= -->

<div class="hint">
    Toca las flores 🌼 y la flor del centro 🌻
</div>


<!-- =========================
     VENTANA DE MÚSICA
========================= -->

<div
    class="modal"
    id="musicModal"
>

    <div class="music-box">

        <div class="music-icon">
            🎵
        </div>

        <h2>
            Una canción para ti
        </h2>

        <p>
            🌼 Berenice 🌼
        </p>


        <!--
        LA CANCIÓN ESTÁ EN:

        musica/Tu CARIN LEON.mp3

        -->


        <button
            id="playButton"
            class="play-button"
        >
            ▶ Reproducir
        </button>


        <button
            class="close-button"
            id="closeMusic"
        >
            Cerrar
        </button>

    </div>

</div>


<script>


/* =========================
   FLORES
========================= */

const flowers = [

    "🌼",
    "🌼",
    "🌼",
    "🌼",
    "🌼",
    "🌼",
    "🌼",
    "🌼",
    "🌼",
    "🌼"

];


let flowerCount = 0;

const maxFlowers = 90;


function createFlower(x, y) {

    if (
        flowerCount >= maxFlowers
    ) {

        return;
    }


    const flower =
        document.createElement(
            "div"
        );


    flower.className =
        "flower";


    flower.textContent =
        flowers[
            Math.floor(
                Math.random()
                * flowers.length
            )
        ];


    if (
        x !== undefined &&
        y !== undefined
    ) {

        flower.style.left =
            x + "px";

        flower.style.top =
            y + "px";

    }

    else {

        flower.style.left =
            Math.random()
            * 95 + "%";

        flower.style.top =
            Math.random()
            * 85 + "%";
    }


    flower.style.fontSize =
        (
            25 +
            Math.random() * 25
        ) + "px";


    flower.style.animationDuration =
        (
            3 +
            Math.random() * 4
        ) + "s";


    flower.addEventListener(
        "click",
        function(e) {

            e.stopPropagation();


            createParticles(
                e.clientX,
                e.clientY
            );


            createRipple(
                e.clientX,
                e.clientY
            );


            for (
                let i = 0;
                i < 4;
                i++
            ) {

                setTimeout(
                    function() {

                        if (
                            flowerCount
                            < maxFlowers
                        ) {

                            createFlower(

                                e.clientX +
                                (
                                    Math.random()
                                    * 120 - 60
                                ),

                                e.clientY +
                                (
                                    Math.random()
                                    * 120 - 60
                                )
                            );
                        }

                    },
                    i * 80
                );
            }

        }
    );


    document.body.appendChild(
        flower
    );


    flowerCount++;
}


/* =========================
   FLORES INICIALES
========================= */

for (
    let i = 0;
    i < 25;
    i++
) {

    createFlower();
}


/* =========================
   PARTÍCULAS
========================= */

function createParticles(x, y) {

    const symbols = [

        "✨",
        "🌼",
        "💛",
        "✨",
        "🌼"

    ];


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        particle.textContent =
            symbols[
                Math.floor(
                    Math.random()
                    * symbols.length
                )
            ];


        particle.style.left =
            x + "px";


        particle.style.top =
            y + "px";


        particle.style.setProperty(
            "--x",
            (
                Math.random()
                * 160 - 80
            ) + "px"
        );


        particle.style.setProperty(
            "--y",
            (
                Math.random()
                * 160 - 80
            ) + "px"
        );


        document.body.appendChild(
            particle
        );


        setTimeout(
            function() {

                particle.remove();

            },
            1000
        );
    }
}


/* =========================
   RIPPLE
========================= */

function createRipple(x, y) {

    const ripple =
        document.createElement(
            "div"
        );


    ripple.className =
        "ripple";


    ripple.style.left =
        (x - 10) + "px";


    ripple.style.top =
        (y - 10) + "px";


    document.body.appendChild(
        ripple
    );


    setTimeout(
        function() {

            ripple.remove();

        },
        700
    );
}


/* =========================
   TOCAR FONDO
========================= */

document.body.addEventListener(
    "click",
    function(e) {

        if (

            e.target.classList
                .contains("flower")

            ||

            e.target.classList
                .contains("special-flower")

            ||

            e.target.closest(
                ".modal"
            )

            ||

            e.target.id ===
                "nightButton"

        ) {

            return;
        }


        createFlower(
            e.clientX,
            e.clientY
        );


        createParticles(
            e.clientX,
            e.clientY
        );


        createRipple(
            e.clientX,
            e.clientY
        );

    }
);


/* =========================
   DÍA / NOCHE
========================= */

const nightButton =
    document.getElementById(
        "nightButton"
    );


nightButton.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();


        document.body.classList.toggle(
            "night"
        );


        if (
            document.body.classList
                .contains("night")
        ) {

            nightButton.textContent =
                "☀️";

        }

        else {

            nightButton.textContent =
                "🌙";
        }

    }
);


/* =========================
   MÚSICA
========================= */

const specialFlower =
    document.getElementById(
        "specialFlower"
    );


const musicModal =
    document.getElementById(
        "musicModal"
    );


const closeMusic =
    document.getElementById(
        "closeMusic"
    );


const playButton =
    document.getElementById(
        "playButton"
    );


/*
    CARGAMOS LA CANCIÓN
    DIRECTAMENTE DESDE
    GITHUB PAGES.
*/

const audioPlayer =
    new Audio(
        "https://dlorenzanaj.github.io/flores/musica/Tu%20CARIN%20LEON.mp3"
    );


audioPlayer.preload =
    "auto";


/* =========================
   ABRIR MÚSICA
========================= */

specialFlower.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();


        musicModal.classList.add(
            "active"
        );


        createParticles(
            e.clientX,
            e.clientY
        );

    }
);


/* =========================
   REPRODUCIR / PAUSAR
========================= */

playButton.addEventListener(
    "click",
    async function(e) {

        e.stopPropagation();


        try {

            if (
                audioPlayer.paused
            ) {

                await audioPlayer.play();

                playButton.textContent =
                    "⏸ Pausar";

            }

            else {

                audioPlayer.pause();

                playButton.textContent =
                    "▶ Reproducir";
            }

        }

        catch (error) {

            console.error(
                "No se pudo reproducir:",
                error
            );

        }

    }
);


/* =========================
   CUANDO TERMINA LA CANCIÓN
========================= */

audioPlayer.addEventListener(
    "ended",
    function() {

        playButton.textContent =
            "▶ Reproducir";

    }
);


/* =========================
   CERRAR
========================= */

closeMusic.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();


        audioPlayer.pause();


        playButton.textContent =
            "▶ Reproducir";


        musicModal.classList.remove(
            "active"
        );

    }
);


/* =========================
   CERRAR TOCANDO AFUERA
========================= */

musicModal.addEventListener(
    "click",
    function(e) {

        if (
            e.target === musicModal
        ) {

            audioPlayer.pause();


            playButton.textContent =
                "▶ Reproducir";


            musicModal.classList.remove(
                "active"
            );
        }

    }
);


/* =========================
   EVITAR CLICS DEL MODAL
========================= */

document
    .querySelector(".music-box")
    .addEventListener(
        "click",
        function(e) {

            e.stopPropagation();

        }
    );

</script>

</body>
</html>
