<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berenice 🌼</title>
<style>
/* =========================
   CONFIGURACIÓN GENERAL
========================= */
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: #fff09b;
}

/* =========================
   ESCENA
========================= */
.scene {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    touch-action: manipulation;
    background: radial-gradient(circle at center, #fffbd2 0%, #fff09b 45%, #ffd45c 100%);
    transition: background 1.2s ease;
}

.scene.night {
    background: radial-gradient(circle at 50% 35%, #27345f 0%, #111a3d 50%, #070b20 100%);
}

/* =========================
   NOMBRE
========================= */
h1 {
    position: absolute;
    z-index: 30;
    top: 8%;
    width: 100%;
    margin: 0;
    text-align: center;
    color: #6b4b00;
    font-size: clamp(42px, 12vw, 82px);
    text-shadow: 0 3px 8px rgba(255,255,255,.8);
    pointer-events: none;
    transition: color 1s ease, text-shadow 1s ease;
}

.scene.night h1 {
    color: #fff4a8;
    text-shadow: 0 0 12px #fff2a6, 0 0 25px #ffd83d;
}

/* =========================
   BOTONES
========================= */
.modeButton, .windButton {
    position: absolute;
    z-index: 100;
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    backdrop-filter: blur(5px);
    font-size: 25px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    transition: transform .2s ease, background .5s ease;
}

.modeButton {
    top: 18px;
    right: 18px;
    background: rgba(255,255,255,.75);
}

.windButton {
    top: 18px;
    right: 88px;
    background: rgba(255,255,255,.75);
    opacity: 0;
    pointer-events: none;
}

.windButton.active {
    opacity: 1;
    pointer-events: auto;
}

.modeButton:active, .windButton:active {
    transform: scale(.85) rotate(15deg);
}

.scene.night .modeButton, .scene.night .windButton {
    background: rgba(20,25,60,.8);
}

/* =========================
   FLORES
========================= */
.flower {
    position: absolute;
    width: 52px;
    height: 52px;
    padding: 0;
    border: none;
    background: transparent;
    font-size: 42px;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    z-index: 10;
    animation: flowerFloat 3s ease-in-out infinite;
    transition: transform .18s ease, opacity 0.5s ease;
}

.flower.new {
    animation: flowerAppear .5s ease-out, flowerFloat 3s .5s ease-in-out infinite;
}

/* =========================
   ANIMACIONES
========================= */
@keyframes flowerFloat {
    0%, 100% { margin-top: 0; transform: rotate(-2deg); }
    50% { margin-top: -9px; transform: rotate(2deg); }
}

@keyframes flowerAppear {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.35); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<div class="scene" id="scene">
    <h1>Berenice</h1>
    <button class="modeButton" id="modeButton">🌙</button>
    <button class="windButton" id="windButton">🍃</button>
</div>
<script>
    /* =========================
       ELEMENTOS
    ========================= */
    const scene = document.getElementById("scene");
    const modeButton = document.getElementById("modeButton");
    const windButton = document.getElementById("windButton");

    /* =========================
       FLORES
    ========================= */
    const initialFlowers = [[8,18], [22,30], [78,22], [90,39], [12,55], [31,68], [67,58], [84,72], [48,84], [4,82], [58,34], [38,18]];
    let flowerCount = 0;
    const MAX_FLOWERS = 90;

    /* =========================
       CREAR FLOR
    ========================= */
    function createFlower(x, y, isNew = false) {
        if (flowerCount >= MAX_FLOWERS) return;

        const flower = document.createElement("button");
        flower.type = "button";
        flower.className = "flower" + (isNew ? " new" : "");
        flower.textContent = "🌼";
        flower.style.left = `calc(${x}% - 26px)`;
        flower.style.top = `calc(${y}% - 26px)`;
        flower.style.animationDelay = `${Math.random() * 1.5}s`;

        scene.appendChild(flower);
        flowerCount++;
        checkWindButton();
    }

    /* =========================
       LIMPIAR JARDÍN
    ========================= */
    function clearGarden() {
        const userFlowers = document.querySelectorAll(".flower.new");
        userFlowers.forEach((f, i) => {
            f.style.opacity = '0';
            setTimeout(() => { f.remove(); flowerCount--; checkWindButton(); }, 500);
        });
    }

    function checkWindButton() {
        if (flowerCount >= MAX_FLOWERS / 2) { windButton.classList.add("active"); } 
        else { windButton.classList.remove("active"); }
    }

    /* =========================
       INICIALIZAR Y EVENTOS
    ========================= */
    initialFlowers.forEach(([x, y]) => createFlower(x, y));
    modeButton.addEventListener("click", () => { scene.classList.toggle("night"); modeButton.textContent = scene.classList.contains("night") ? "☀️" : "🌙"; });
    windButton.addEventListener("click", clearGarden);
    scene.addEventListener("click", (e) => {
        if (e.target !== scene) return;
        const rect = scene.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        createFlower(x, y, true);
    });
</script>
</body>
</html>
