<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berenice 🌼</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.scene {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: linear-gradient(to bottom, #fff59d, #ffe082, #ffcc80);
    transition: background 1s;
}

.scene.night {
    background: linear-gradient(to bottom, #090b24, #15154a, #25255f);
}

/* Título */
h1 {
    position: absolute;
    top: 35px;
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: 42px;
    text-shadow: 0 3px 10px rgba(0,0,0,.3);
    z-index: 20;
}

/* Botón día/noche */
.modeButton {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 50;
    border: none;
    border-radius: 30px;
    padding: 12px 16px;
    font-size: 20px;
    cursor: pointer;
    background: rgba(255,255,255,.8);
}

/* Luna */
.moon {
    position: absolute;
    right: 12%;
    top: 15%;
    font-size: 65px;
    opacity: 0;
    transition: opacity 1s;
}

.scene.night .moon {
    opacity: 1;
}

/* Estrellas */
.star {
    position: absolute;
    color: white;
    font-size: 10px;
    opacity: 0;
    animation: twinkle 2s infinite alternate;
}

.scene.night .star {
    opacity: 1;
}

@keyframes twinkle {
    from {
        opacity: .2;
    }

    to {
        opacity: 1;
    }
}

/* Flores */
.flower {
    position: absolute;
    font-size: 38px;
    cursor: pointer;
    user-select: none;
    animation: float 3s ease-in-out infinite;
    transition: transform .2s;
    z-index: 10;
}

.flower:hover {
    transform: scale(1.25);
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

/* Flor especial */
.specialFlower {
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    font-size: 100px;
    cursor: pointer;
    z-index: 25;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,.25));
    animation: specialFloat 3s ease-in-out infinite;
}

@keyframes specialFloat {
    0%,100% {
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        transform: translate(-50%, -50%) scale(1.08);
    }
}

/* Mariposas */
.butterfly {
    position: absolute;
    font-size: 28px;
    z-index: 15;
    animation: fly 12s linear infinite;
}

.b1 {
    top: 25%;
    left: -10%;
    animation-delay: 0s;
}

.b2 {
    top: 60%;
    left: -10%;
    animation-delay: 3s;
}

.b3 {
    top: 40%;
    left: -10%;
    animation-delay: 6s;
}

.b4 {
    top: 75%;
    left: -10%;
    animation-delay: 9s;
}

@keyframes fly {
    0% {
        left: -10%;
        transform: translateY(0) rotate(0deg);
    }

    25% {
        transform: translateY(-40px) rotate(10deg);
    }

    50% {
        transform: translateY(30px) rotate(-10deg);
    }

    75% {
        transform: translateY(-30px) rotate(10deg);
    }

    100% {
        left: 110%;
        transform: translateY(0) rotate(0deg);
    }
}

/* Texto inferior */
.hint {
    position: absolute;
    bottom: 35px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 18px;
    text-shadow: 0 2px 5px rgba(0,0,0,.4);
    z-index: 20;
}

/* Partículas */
.particle {
    position: absolute;
    pointer-events: none;
    font-size: 20px;
    animation: particle .8s forwards;
    z-index: 40;
}

@keyframes particle {
    from {
        opacity: 1;
        transform: translate(0,0) scale(1);
    }

    to {
        opacity: 0;
        transform:
            translate(var(--x), var(--y))
            scale(.3);
    }
}

/* Efecto al tocar */
.ripple {
    position: absolute;
    width: 20px;
    height: 20px;
    border: 3px solid white;
    border-radius: 50%;
    pointer-events: none;
    animation: ripple .7s forwards;
    z-index: 35;
}

@keyframes ripple {
    from {
        transform: scale(1);
        opacity: .8;
    }

    to {
        transform: scale(8);
        opacity: 0;
    }
}

/* Ventana de música */
.musicBox {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.8);

    width: min(90%, 380px);

    background: rgba(255,255,255,.97);

    border-radius: 25px;

    padding: 25px;

    text-align: center;

    box-shadow:
        0 15px 50px rgba(0,0,0,.35);

    z-index: 100;

    opacity: 0;
    pointer-events: none;

    transition: .3s;
}

.musicBox.show {
    opacity: 1;
    pointer-events: auto;

    transform:
        translate(-50%, -50%)
        scale(1);
}

.musicBox h2 {
    color: #d99b00;
    margin-bottom: 20px;
}

audio {
    width: 100%;
    margin-bottom: 18px;
}

.closeMusic {
    border: none;

    padding: 10px 20px;

    border-radius: 20px;

    background: #f2b705;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

/* Fondo oscuro detrás del reproductor */
.overlay {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.35);

    z-index: 90;

    opacity: 0;
    pointer-events: none;

    transition: .3s;
}

.overlay.show {
    opacity: 1;
    pointer-events: auto;
}
</style>
</head>

<body>

<div class="scene" id="scene">

    <!-- Nombre -->
    <h1>Berenice 🌼</h1>

    <!-- Día / noche -->
    <button class="modeButton" id="modeButton">
        🌙
    </button>

    <!-- Luna -->
    <div class="moon">
        🌙
    </div>

    <!-- Estrellas -->
    <div class="star" style="left:10%;top:15%">✦</div>
    <div class="star" style="left:25%;top:25%">✦</div>
    <div class="star" style="left:40%;top:12%">✦</div>
    <div class="star" style="left:60%;top:20%">✦</div>
    <div class="star" style="left:75%;top:10%">✦</div>
    <div class="star" style="left:90%;top:30%">✦</div>
    <div class="star" style="left:15%;top:45%">✦</div>
    <div class="star" style="left:80%;top:50%">✦</div>
    <div class="star" style="left:50%;top:35%">✦</div>
    <div class="star" style="left:35%;top:65%">✦</div>
    <div class="star" style="left:70%;top:70%">✦</div>
    <div class="star" style="left:5%;top:75%">✦</div>

    <!-- Mariposas -->
    <div class="butterfly b1">🦋</div>
    <div class="butterfly b2">🦋</div>
    <div class="butterfly b3">🦋</div>
    <div class="butterfly b4">🦋</div>

    <!-- Flor especial -->
    <div class="specialFlower" id="specialFlower">
        🌻
    </div>

    <!-- Texto -->
    <div class="hint">
        Toca las flores 🌼
    </div>

</div>


<!-- Fondo oscuro -->
<div class="overlay" id="overlay"></div>


<!-- Reproductor -->
<div class="musicBox" id="musicBox">

    <h2>🎵 Reproducir canción</h2>

    <audio id="audioPlayer" controls>
        <source
            src="Musica/Tu CARIN LEON.mp3"
            type="audio/mpeg"
        >

        Tu navegador no puede reproducir este audio.
    </audio>

    <button class="closeMusic" id="closeMusic">
        Cerrar
    </button>

</div>


<script>

const scene =
    document.getElementById("scene");

const modeButton =
    document.getElementById("modeButton");

const specialFlower =
    document.getElementById("specialFlower");

const musicBox =
    document.getElementById("musicBox");

const overlay =
    document.getElementById("overlay");

const audioPlayer =
    document.getElementById("audioPlayer");

const closeMusic =
    document.getElementById("closeMusic");


/* =========================
   CREAR FLORES
========================= */

function createFlower(x, y) {

    const flower =
        document.createElement("div");

    flower.className = "flower";

    flower.textContent = "🌼";

    flower.style.left = x + "px";
    flower.style.top = y + "px";

    flower.addEventListener(
        "click",
        function(e) {

            e.stopPropagation();

            createParticles(x, y);

        }
    );

    scene.appendChild(flower);
}


/* =========================
   PARTÍCULAS
========================= */

function createParticles(x, y) {

    const particles =
        ["✨", "🌼", "💛"];

    for(let i = 0; i < 6; i++) {

        const particle =
            document.createElement("div");

        particle.className =
            "particle";

        particle.textContent =
            particles[
                Math.floor(
                    Math.random()
                    * particles.length
                )
            ];

        particle.style.left =
            x + "px";

        particle.style.top =
            y + "px";

        particle.style.setProperty(
            "--x",
            (Math.random() * 120 - 60)
            + "px"
        );

        particle.style.setProperty(
            "--y",
            (Math.random() * 120 - 60)
            + "px"
        );

        scene.appendChild(particle);

        setTimeout(
            () => particle.remove(),
            800
        );
    }
}


/* =========================
   EFECTO AL TOCAR
========================= */

scene.addEventListener(
    "click",
    function(e) {

        if(e.target === specialFlower)
            return;

        if(
            e.target.classList
            .contains("flower")
        )
            return;

        const ripple =
            document.createElement("div");

        ripple.className = "ripple";

        ripple.style.left =
            (e.clientX - 10) + "px";

        ripple.style.top =
            (e.clientY - 10) + "px";

        scene.appendChild(ripple);

        createFlower(
            e.clientX - 20,
            e.clientY - 20
        );

        setTimeout(
            () => ripple.remove(),
            700
        );
    }
);


/* =========================
   FLORES INICIALES
========================= */

const initialFlowers = [

    [10,70],
    [20,40],
    [30,75],
    [70,75],
    [80,40],
    [90,70],
    [15,55],
    [85,55]

];

initialFlowers.forEach(
    pos => {

        createFlower(
            window.innerWidth
            * pos[0] / 100,

            window.innerHeight
            * pos[1] / 100
        );

    }
);


/* =========================
   DÍA / NOCHE
========================= */

modeButton.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        scene.classList.toggle(
            "night"
        );

        if(
            scene.classList
            .contains("night")
        ) {

            modeButton.textContent =
                "☀️";

        } else {

            modeButton.textContent =
                "🌙";
        }

    }
);


/* =========================
   ABRIR REPRODUCTOR
========================= */

specialFlower.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        musicBox.classList.add(
            "show"
        );

        overlay.classList.add(
            "show"
        );

    }
);


/* =========================
   CERRAR REPRODUCTOR
========================= */

function closeMusicBox() {

    audioPlayer.pause();

    audioPlayer.currentTime = 0;

    musicBox.classList.remove(
        "show"
    );

    overlay.classList.remove(
        "show"
    );
}


closeMusic.addEventListener(
    "click",
    closeMusicBox
);


overlay.addEventListener(
    "click",
    closeMusicBox
);

</script>

</body>
</html>
