<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Berenice 🌼</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: radial-gradient(
        circle at center,
        #fff9c4 0%,
        #ffe98a 45%,
        #ffd45c 100%
    );

    display: flex;
    justify-content: center;
    align-items: center;
}

.scene {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    touch-action: manipulation;
}

h1 {
    position: absolute;
    z-index: 10;

    top: 8%;
    width: 100%;

    margin: 0;

    text-align: center;

    color: #6b4b00;

    font-size: clamp(42px, 12vw, 82px);

    text-shadow:
        0 3px 8px rgba(255,255,255,.8);

    pointer-events: none;
}

.flower {
    position: absolute;

    width: 52px;
    height: 52px;

    padding: 0;
    border: 0;

    background: transparent;

    font-size: 42px;
    line-height: 1;

    cursor: pointer;

    user-select: none;

    -webkit-tap-highlight-color: transparent;

    animation:
        float 3s ease-in-out infinite;

    transition:
        transform .18s ease;
}

.flower:active {
    transform:
        scale(1.45)
        rotate(12deg);
}

.flower.new {
    animation:
        pop .5s ease-out,
        float 3s .5s ease-in-out infinite;
}

.hint {
    position: absolute;

    z-index: 10;

    bottom: 5%;

    width: 100%;

    text-align: center;

    color: #6b4b00;

    font-size: 16px;

    font-weight: 600;

    pointer-events: none;
}

.spark {
    position: absolute;

    pointer-events: none;

    font-size: 22px;

    animation:
        burst .65s ease-out forwards;
}


/* Animaciones */

@keyframes float {

    0%, 100% {
        margin-top: 0;
    }

    50% {
        margin-top: -9px;
    }
}


@keyframes pop {

    0% {
        transform: scale(0);
        opacity: 0;
    }

    70% {
        transform: scale(1.35);
        opacity: 1;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}


@keyframes burst {

    from {
        transform:
            translate(0,0)
            scale(.5);

        opacity: 1;
    }

    to {
        transform:
            translate(var(--x),var(--y))
            scale(1.2);

        opacity: 0;
    }
}


@media (prefers-reduced-motion: reduce) {

    .flower {
        animation: none;
    }

    .flower.new {
        animation:
            pop .3s ease-out;
    }
}

</style>
</head>


<body>

<div class="scene" id="scene">

    <h1>Berenice</h1>

    <div class="hint">
        Toca una flor 🌼
    </div>

</div>


<script>

(() => {

    const scene =
        document.getElementById("scene");


    /*
       Flores iniciales
    */

    const initialFlowers = [

        [8,18],
        [22,30],
        [78,22],
        [90,39],
        [12,55],
        [31,68],
        [67,58],
        [84,72],
        [48,84],
        [4,82],
        [58,34],
        [38,18]

    ];


    let flowerCount = 0;


    /*
       Máximo de flores
       para evitar que el teléfono
       se vuelva lento.
    */

    const MAX_FLOWERS = 90;


    /*
       Crear una flor
    */

    function createFlower(x, y, isNew = false) {

        if (flowerCount >= MAX_FLOWERS) {
            return;
        }


        const flower =
            document.createElement("button");


        flower.type = "button";


        flower.className =
            "flower" +
            (isNew ? " new" : "");


        flower.textContent = "🌼";


        flower.setAttribute(
            "aria-label",
            "Flor amarilla. Tócala para que aparezcan más."
        );


        flower.style.left =
            `calc(${x}% - 26px)`;


        flower.style.top =
            `calc(${y}% - 26px)`;


        flower.style.animationDelay =
            `${Math.random() * 1.5}s`;


        /*
           Cuando toquen una flor
        */

        flower.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                const rect =
                    scene.getBoundingClientRect();


                const centerX =
                    event.clientX - rect.left;


                const centerY =
                    event.clientY - rect.top;


                /*
                   Efecto de crecimiento
                */

                flower.style.transform =
                    "scale(1.5)";


                setTimeout(() => {

                    flower.style.transform = "";

                }, 180);


                /*
                   Crear pequeñas flores
                   y destellos alrededor
                */

                for (let i = 0; i < 5; i++) {

                    const spark =
                        document.createElement("span");


                    spark.className =
                        "spark";


                    spark.textContent =
                        i % 2
                        ? "✨"
                        : "🌼";


                    spark.style.left =
                        `${centerX - 11}px`;


                    spark.style.top =
                        `${centerY - 11}px`;


                    spark.style.setProperty(
                        "--x",
                        `${Math.cos(i * 1.256) * 55}px`
                    );


                    spark.style.setProperty(
                        "--y",
                        `${Math.sin(i * 1.256) * 55}px`
                    );


                    scene.appendChild(spark);


                    setTimeout(() => {

                        spark.remove();

                    }, 700);

                }


                /*
                   Cada toque crea
                   4 flores nuevas
                */

                for (let i = 0; i < 4; i++) {

                    const angle =
                        Math.random() *
                        Math.PI *
                        2;


                    const distance =
                        7 +
                        Math.random() * 9;


                    let newX =
                        x +
                        Math.cos(angle) *
                        distance;


                    let newY =
                        y +
                        Math.sin(angle) *
                        distance;


                    /*
                       Mantener las flores
                       dentro de la pantalla
                    */

                    newX =
                        Math.max(
                            4,
                            Math.min(96, newX)
                        );


                    newY =
                        Math.max(
                            15,
                            Math.min(94, newY)
                        );


                    createFlower(
                        newX,
                        newY,
                        true
                    );

                }

            }
        );


        scene.appendChild(flower);


        flowerCount++;

    }


    /*
       Crear las flores iniciales
    */

    initialFlowers.forEach(
        ([x, y]) => {
            createFlower(x, y);
        }
    );


    /*
       También puedes tocar
       cualquier espacio vacío
       para hacer aparecer una flor.
    */

    scene.addEventListener(
        "click",
        function(event) {

            if (
                event.target !== scene ||
                flowerCount >= MAX_FLOWERS
            ) {
                return;
            }


            const rect =
                scene.getBoundingClientRect();


            const x =
                ((event.clientX - rect.left)
                / rect.width) * 100;


            const y =
                ((event.clientY - rect.top)
                / rect.height) * 100;


            createFlower(
                x,
                y,
                true
            );

        }
    );

})();

</script>

</body>
</html>
